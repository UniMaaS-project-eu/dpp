services:
  mongo:
    image: mongo:${MONGO_VERSION}
    hostname: ${MONGO_HOSTNAME}
    container_name: mongo-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    working_dir: /mongo
    ports:
      - "${MONGO_EXTERNAL_PORT}:${MONGO_INTERNAL_PORT}"
    command: --nojournal
    networks:
      dpp_network:
        ipv4_address: ${NETWORK_PREFIX}.2
    volumes:
      - mongo-vdb:/data

  orion:
    image: fiware/orion-ld:${ORION_VERSION}
    hostname: ${ORION_HOSTNAME}
    container_name: orion-ld
    depends_on:
      - mongo
    expose:
      - "${ORION_INTERNAL_PORT}"
    ports:
      - "${ORION_EXTERNAL_PORT}:${ORION_INTERNAL_PORT}" 
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -dbhost ${MONGO_HOSTNAME} -logLevel DEBUG
    networks:
      dpp_network:
        ipv4_address: ${NETWORK_PREFIX}.3
    healthcheck:
      test: curl --fail -s http://${ORION_HOSTNAME}:${ORION_INTERNAL_PORT}/version || exit 1
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    hostname: ${WEB_HOSTNAME}
    container_name: web
    depends_on:
      - orion
      - keycloak
    expose:
      - "${WEB_INTERNAL_PORT}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./web:/app
    networks:
      dpp_network:
        ipv4_address: ${NETWORK_PREFIX}.4
    environment:
      - WEB_INTERNAL_PORT=${WEB_INTERNAL_PORT}
      - WEB_SECRET_KEY=${WEB_SECRET_KEY}
      - WEB_DEBUG=${WEB_DEBUG} # Values: 0 - False, 1 - True
      - ORION_URL=${ORION_PROTOCOL}${ORION_HOSTNAME}:${ORION_INTERNAL_PORT}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PROTOCOL}${KEYCLOAK_PUBLIC_HOSTNAME}:${KEYCLOAK_EXTERNAL_PORT}
      - KEYCLOAK_INTERNAL_URL=${KEYCLOAK_PROTOCOL}${KEYCLOAK_HOSTNAME}:${KEYCLOAK_INTERNAL_PORT}
      - API_REST_URL=${API_PROTOCOL}${API_HOSTNAME}:${API_EXTERNAL_PORT}

  web-https-proxy:
    image: nginx:1.27-alpine
    hostname: web-https-proxy
    container_name: web-https-proxy
    depends_on:
      - web
    ports:
      - "${WEB_EXTERNAL_PORT}:443"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./web/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      dpp_network:
        ipv4_address: ${NETWORK_PREFIX}.6
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    hostname: ${KEYCLOAK_HOSTNAME}
    container_name: keycloak-dpp
    ports:
      - "${KEYCLOAK_EXTERNAL_PORT}:${KEYCLOAK_INTERNAL_PORT}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      dpp_network:
        ipv4_address: ${NETWORK_PREFIX}.5
    restart: always
    command: ['start-dev']
    volumes:
      - keycloak-volume:/opt/keycloak/data
      - ./certs/:/opt/keycloak/certs
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_REALM=${KEYCLOAK_REALM}
      - KC_HTTPS_CERTIFICATE_FILE=/opt/keycloak/certs/${KEYCLOAK_CERT}
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/opt/keycloak/certs/${KEYCLOAK_KEY}
      - KC_HOSTNAME=${KEYCLOAK_PROTOCOL}${KEYCLOAK_PUBLIC_HOSTNAME}:${KEYCLOAK_EXTERNAL_PORT} # Keep issuer consistent for browser and backend calls
      - KC_HOSTNAME_STRICT=false # Remove in the future (this allows a token with localhost issuer)

networks:
  dpp_network:
    ipam:
      config:
        - subnet: ${NETWORK_PREFIX}.0/24
  fabric_test:
      external: true

volumes:
  mongo-vdb:
    driver: local
  keycloak-volume:
    driver: local